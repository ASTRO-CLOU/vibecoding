                    instructions: `# Синтаксис Python

Python — это язык программирования с простым и читаемым синтаксисом. В этом уроке вы научитесь:

1. Писать простую программу на Python
2. Выводить текст на экран с помощью функции \`print()\`
3. Понимать структуру программы

## Что такое Python?

Python — это высокоуровневый язык программирования общего назначения, который:
- Имеет простой и понятный синтаксис
- Поддерживает несколько парадигм программирования
- Имеет огромную стандартную библиотеку

## Первая программа на Python

Традиционно, первая программа выводит "Hello, World!" на экран:

\`\`\`python
print("Hello, World!")
\`\`\`

Функция \`print()\` выводит текст в консоль. Строка текста должна быть в кавычках.`,

`,

                    instructions: `# Переменные и типы данных

Переменные — это контейнеры для хранения данных. В Python не нужно указывать тип переменной явно.

## Создание переменных

\`\`\`python
# Целое число (int)
age = 25

# Число с плавающей точкой (float)
height = 1.75

# Строка (str)
name = "Иван"

# Булево значение (bool)
is_student = True
\`\`\`

## Типы данных в Python

1. **int** — целые числа (5, -3, 1000)
2. **float** — числа с плавающей точкой (3.14, -0.001)
3. **str** — строки ("Привет", 'Мир')
4. **bool** — логические значения (True, False)

## Определение типа переменной

Для определения типа переменной используйте функцию \`type()\`:

\`\`\`python
print(type(age))  # <class 'int'>
print(type(name))  # <class 'str'>
\`\`\``,
                    starterCode: `# Создайте переменные разных типов
age = 25  # Целое число
height = 1.75  # Число с плавающей точкой

# Выведите каждую переменную на отдельной строке
print(age)
print(height)
print(name)
print(is_student)

# Определите и выведите тип каждой переменной
print(type(age))
print(type(height))
print(type(name))
print(type(is_student))
`,

                    instructions: `# Условные операторы if/else

Условные операторы позволяют выполнять код в зависимости от условий.

## Базовый синтаксис

\`\`\`python
if условие:
    # Код выполняется, если условие истинно
else:
    # Код выполняется, если условие ложно
\`\`\`

## Пример

\`\`\`python
age = 18

if age >= 18:
    print("Вы совершеннолетний")
else:
    print("Вы несовершеннолетний")
\`\`\`

## Операторы сравнения

- \`==\` — равно
- \`!=\` — не равно
- \`>\` — больше
- \`<\` — меньше
- \`>=\` — больше или равно
- \`<=\` — меньше или равно

## Логические операторы

- \`and\` — логическое И
- \`or\` — логическое ИЛИ
- \`not\` — логическое НЕ`,

if number % 2 == 0:

## Создание списка

\`\`\`python
# Пустой список
empty_list = []

# Список с числами
numbers = [1, 2, 3, 4, 5]

# Список с разными типами данных
mixed = [1, "строка", 3.14, True]
\`\`\`

## Доступ к элементам

\`\`\`python
numbers = [1, 2, 3, 4, 5]

print(numbers[0])  # Первый элемент: 1
print(numbers[2])  # Третий элемент: 3
print(numbers[-1])  # Последний элемент: 5
\`\`\`

## Операции со списками

\`\`\`python
numbers = [1, 2, 3, 4, 5]

# Длина списка
print(len(numbers))  # 5

# Добавление элемента
numbers.append(6)
print(numbers)  # [1, 2, 3, 4, 5, 6]

# Удаление элемента по индексу
del numbers[0]
print(numbers)  # [2, 3, 4, 5, 6]

# Проверка наличия элемента
print(3 in numbers)  # True
\`\`\``,

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ============================================
        
        let pyodide = null;
        let currentLessonIndex = 0;
        let editor = null;
        let isLessonCompleted = false;
        
        // Элементы DOM
        const lessonsList = document.getElementById('lessons-list');
        const instructionsEl = document.getElementById('instructions');
        const requirementsList = document.getElementById('requirements-list');
        const lessonTitle = document.getElementById('lesson-title');
        const codeEditor = document.getElementById('code-editor');
        const consoleOutput = document.getElementById('console-output');
        const testResults = document.getElementById('test-results');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        
        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', async function() {
            await initializePyodide();
            initializeCodeMirror();
            renderLessons();
            loadLesson(0);
            loadProgressFromStorage();
        });
        
        // ============================================
        // ФУНКЦИЯ ИНИЦИАЛИЗАЦИИ PYODIDE
        // ============================================
        
        async function initializePyodide() {
            const loader = document.getElementById('pyodide-loader');
            try {
                // Показать лоадер
                loader.style.display = 'flex';
                
                // Загрузить Pyodide
                pyodide = await loadPyodide({
                    indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/"
                });
                
                // Скрыть лоадер
                loader.style.display = 'none';
                
                showNotification("Python движок успешно загружен!");
                
            } catch (error) {
                console.error('Ошибка загрузки Pyodide:', error);
                loader.style.display = 'none';
                
                // Показать сообщение об ошибке
                consoleOutput.innerHTML = `
                    <div style="color: #ef4444;">
                        <strong>Ошибка загрузки Python движка:</strong> ${error.message}<br>
                        Попробуйте обновить страницу или проверьте подключение к интернету.
                    </div>
                `;
            }
        }
        
        // ============================================
        // ФУНКЦИЯ ИНИЦИАЛИЗАЦИИ CODEMIRROR
        // ============================================
        
        function initializeCodeMirror() {
            editor = CodeMirror.fromTextArea(codeEditor, {
                mode: 'python',
                theme: 'material-darker',
                lineNumbers: true,
                indentUnit: 4,
                tabSize: 4,
                lineWrapping: true,
                autofocus: true,
                extraKeys: {
                    "Ctrl-Space": "autocomplete",
                    "Ctrl-Enter": function() { runCode(); },
                    "Cmd-Enter": function() { runCode(); }
                }
            });
            
            // Обработка изменений в редакторе
            editor.on('change', function() {
                saveUserCode();
            });
        }
        
        // ============================================
        // ФУНКЦИИ РЕНДЕРИНГА УРОКОВ
        // ============================================
        
        function renderLessons() {
            lessonsList.innerHTML = '';
            
            courseModule.lessons.forEach((lesson, index) => {
                const lessonItem = document.createElement('button');
                lessonItem.className = `w-full text-left p-3 rounded-lg transition-colors ${
                    index === currentLessonIndex 
                        ? 'bg-blue-600 border border-blue-500' 
                        : 'bg-slate-700 border border-slate-600 hover:bg-slate-600'
                }`;
                
                lessonItem.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-medium">${lesson.title}</span>
                        ${lesson.completed ? 
                            `<span class="ml-2 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center">
                                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </span>` : ''
                        }
                    </div>
                `;
                
                lessonItem.onclick = () => {
                    loadLesson(index);
                    
                    // На мобильных показать контент урока
                    if (window.innerWidth < 768) {
                        document.querySelectorAll('[data-panel]').forEach(btn => {
                            btn.classList.remove('border-blue-500', 'text-blue-400');
                            btn.classList.add('border-transparent', 'text-slate-400');
                        });
                        document.querySelector('[data-panel="lesson-content"]').classList.add('border-blue-500', 'text-blue-400');
                        document.querySelector('[data-panel="lesson-content"]').classList.remove('border-transparent', 'text-slate-400');
                        
                        document.getElementById('lessons-panel').classList.add('hidden');
                        document.getElementById('lesson-content-panel').classList.remove('hidden');
                        document.getElementById('lesson-content-panel').classList.add('flex');
                    }
                };
                
                lessonsList.appendChild(lessonItem);
            });
        }
        
        function loadLesson(index) {
            const lesson = courseModule.lessons[index];
            currentLessonIndex = index;
            
            // Обновить заголовок
            lessonTitle.textContent = lesson.title;
            
            // Отрендерить инструкции (Markdown)
            instructionsEl.innerHTML = marked.parse(lesson.instructions);
            
            // Отрендерить требования
            requirementsList.innerHTML = '';
            lesson.tests.forEach(test => {
                const li = document.createElement('li');
                li.textContent = test.description;
                requirementsList.appendChild(li);
            });
            
            // Загрузить код пользователя или стартовый код
            const savedCode = localStorage.getItem(`code_${lesson.id}`);
            editor.setValue(savedCode || lesson.starterCode);
            
            // Очистить вывод и тесты
            consoleOutput.innerHTML = '';
            testResults.innerHTML = '<div class="text-xs text-slate-400">Запустите код для проверки</div>';
            
            // Обновить список уроков
            renderLessons();
        }
        
        // ============================================
        // ФУНКЦИИ ВЫПОЛНЕНИЯ КОДА
        // ============================================
        
        async function runCode() {
            if (!pyodide) {
                consoleOutput.innerHTML = '<div style="color: #ef4444;">Python движок не загружен. Перезагрузите страницу.</div>';
                return;
            }
            
            const code = editor.getValue();
            consoleOutput.innerHTML = '';
            
            try {
                // Перенаправить stdout и stderr
                pyodide.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                    sys.stderr = io.StringIO()
                `);
                
                // Выполнить код пользователя
                await pyodide.runPythonAsync(code);
                
                // Получить вывод
                const stdout = pyodide.runPython("sys.stdout.getvalue()");
                const stderr = pyodide.runPython("sys.stderr.getvalue()");
                
                // Показать вывод
                if (stdout) {
                    consoleOutput.innerHTML += `<div style="color: #22c55e;">${stdout}</div>`;
                }
                
                if (stderr) {
                    consoleOutput.innerHTML += `<div style="color: #ef4444;">${stderr}</div>`;
                }
                
                // Сохранить код пользователя
                saveUserCode();
                
            } catch (error) {
                consoleOutput.innerHTML += `<div style="color: #ef4444;">Ошибка выполнения: ${error.message}</div>`;
            }
        }
        
        async function checkCode() {
            if (!pyodide) {
                testResults.innerHTML = '<div class="text-red-500">Python движок не загружен</div>';
                return;
            }
            
            const lesson = courseModule.lessons[currentLessonIndex];
            const code = editor.getValue();
            let output = '';
            
            try {
                // Перенаправить stdout
                pyodide.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);
                
                // Выполнить код
                await pyodide.runPythonAsync(code);
                output = pyodide.runPython("sys.stdout.getvalue()");
                
            } catch (error) {
                output = `Ошибка: ${error.message}`;
            }
            
            // Запустить тесты
            let allPassed = true;
            testResults.innerHTML = '';
            
            lesson.tests.forEach(test => {
                const resultItem = document.createElement('div');
                const testResult = test.testFunction(output);
                
                if (testResult) {
                    resultItem.className = 'test-result test-pass p-3 rounded-lg border text-xs';
                    resultItem.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            <span class="text-green-400">${test.description}</span>
                        </div>
                    `;
                } else {
                    allPassed = false;
                    resultItem.className = 'test-result test-fail p-3 rounded-lg border text-xs';
                    resultItem.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span class="text-red-400">${test.errorMessage}</span>
                        </div>
                    `;
                }
                
                testResults.appendChild(resultItem);
            });
            
            // Если все тесты пройдены
            if (allPassed) {
                showNotification("Все тесты пройдены успешно! 🎉");
                markLessonAsCompleted();
            } else {
                showNotification("Некоторые тесты не пройдены. Проверьте код.", "error");
            }
        }
        
        // ============================================
        // ФУНКЦИИ РАБОТЫ С ПРОГРЕССОМ
        // ============================================
        
        function saveUserCode() {
            const lesson = courseModule.lessons[currentLessonIndex];
            localStorage.setItem(`code_${lesson.id}`, editor.getValue());
        }
        
        function saveProgressToStorage() {
            const progress = courseModule.lessons.map(lesson => ({
                id: lesson.id,
                completed: lesson.completed || false
            }));
            
            localStorage.setItem('pythonLearnProgress', JSON.stringify(progress));
            updateProgressBar();
        }
        
        function loadProgressFromStorage() {
            const savedProgress = localStorage.getItem('pythonLearnProgress');
            
            if (savedProgress) {
                const progress = JSON.parse(savedProgress);
                
                progress.forEach(savedLesson => {
                    const lesson = courseModule.lessons.find(l => l.id === savedLesson.id);
                    if (lesson) {
                        lesson.completed = savedLesson.completed;
                    }
                });
                
                updateProgressBar();
                renderLessons();
            }
        }
        
        function markLessonAsCompleted() {
            const lesson = courseModule.lessons[currentLessonIndex];
            lesson.completed = true;
            saveProgressToStorage();
            renderLessons();
        }
        
        function updateProgressBar() {
            const completedCount = courseModule.lessons.filter(lesson => lesson.completed).length;
            const totalCount = courseModule.lessons.length;
            const percent = Math.round((completedCount / totalCount) * 100);
            
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;
        }
        
        function resetProgress() {
            localStorage.removeItem('pythonLearnProgress');
            courseModule.lessons.forEach(lesson => {
                lesson.completed = false;
                localStorage.removeItem(`code_${lesson.id}`);
            });
            
            currentLessonIndex = 0;
            renderLessons();
            loadLesson(0);
            updateProgressBar();
            showNotification("Прогресс сброшен");
        }
        
        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notification-text');
            const notificationIcon = notification.querySelector('svg');
            
            // Установить текст и стиль в зависимости от типа
            notificationText.textContent = message;
            
            if (type === 'error') {
                notification.classList.remove('bg-green-500');
                notification.classList.add('bg-red-500');
                notificationIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>';
            } else {
                notification.classList.remove('bg-red-500');
                notification.classList.add('bg-green-500');
                notificationIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
            }
            
            // Показать уведомление
            notification.classList.remove('hidden');
            notification.classList.remove('scale-0');
            notification.classList.add('scale-100');
            
            // Скрыть через 3 секунды
            setTimeout(() => {
                notification.classList.remove('scale-100');
                notification.classList.add('scale-0');
                setTimeout(() => {
                    notification.classList.add('hidden');
                }, 300);
            }, 3000);
        }
        
        // ============================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================
        
        // Кнопка запуска кода
        document.getElementById('run-code').addEventListener('click', runCode);
        
        // Кнопка проверки кода
        document.getElementById('check-code').addEventListener('click', checkCode);
        
        // Кнопка показа решения
        document.getElementById('show-solution').addEventListener('click', function() {
            const lesson = courseModule.lessons[currentLessonIndex];
            
            // Спросить подтверждение
            if (confirm("Вы уверены, что хотите увидеть решение?")) {
                editor.setValue(lesson.solution);
                showNotification("Решение загружено в редактор");
            }
        });
        
        // Кнопка сброса прогресса
        document.getElementById('reset-progress').addEventListener('click', function() {
            if (confirm("Вы уверены, что хотите сбросить весь прогресс?")) {
                resetProgress();
            }
        });
        
        // Мобильные табы
        document.querySelectorAll('[data-panel]').forEach(button => {
            button.addEventListener('click', function() {
                const panelId = this.getAttribute('data-panel');
                
                // Скрыть все панели
                document.querySelectorAll('[id$="-panel"]').forEach(panel => {
                    panel.classList.add('hidden');
                });
                
                // Показать выбранную панель
                document.getElementById(`${panelId}-panel`).classList.remove('hidden');
                document.getElementById(`${panelId}-panel`).classList.add('flex');
                
                // Обновить активный таб
                document.querySelectorAll('[data-panel]').forEach(btn => {
                    btn.classList.remove('border-blue-500', 'text-blue-400');
                    btn.classList.add('border-transparent', 'text-slate-400');
                });
                
                this.classList.add('border-blue-500', 'text-blue-400');
                this.classList.remove('border-transparent', 'text-slate-400');
            });
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            // Ctrl+Enter для запуска кода
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
            
            // Ctrl+Shift+Enter для проверки кода
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Enter') {
                e.preventDefault();
                checkCode();
            }
        });
    </script>
