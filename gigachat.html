<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 Python Course — freeCodeCamp Style</title>

  <!-- Tailwind 3.4 -->
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.17/dist/tailwind.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/lucide.js"></script>

  <!-- CodeMirror 6 + Python mode + Material theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@6.0.1/lib/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@6.0.1/theme/material.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/codemirror@6.0.1/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@6.0.1/mode/python/python.min.js"></script>

  <!-- Pyodide 0.26 (Python 3.11 + numpy + matplotlib) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js" defer></script>

  <style>
    /* === fCC-like dark theme === */
    .dark\:bg-base-0 { background-color: #0d1117; }
    .dark\:bg-base-1 { background-color: #161b22; }
    .dark\:bg-base-2 { background-color: #1c2128; }
    .dark\:bg-base-3 { background-color: #21262d; }
    .dark\:text-fg { color: #c9d1d9; }
    .dark\:text-fg-muted { color: #8b949e; }
    .dark\:text-accent { color: #f59e0b; }
    .dark\:text-success { color: #10b981; }
    .dark\:text-error { color: #ef4444; }
    .dark\:text-link { color: #58a6ff; }
    .dark\:border-base { border-color: #30363d; }
    .dark\:bg-card { background-color: #161b22; }

    /* Console terminal */
    #console-box {
      background: #0d1117;
      color: #3fb950;
      font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
      font-size: 0.85rem;
      border: 1px solid #21262d;
      border-radius: 0.5rem;
      padding: 0.75rem;
      height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Test checklist */
    .test-item {
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      padding-left: 0.5rem;
      margin-bottom: 0.25rem;
    }
    .test-item.passed { border-left-color: #10b981; background: rgba(16,185,129,0.08); }
    .test-item.failed { border-left-color: #ef4444; background: rgba(239,68,68,0.08); }
    .test-item.pending { border-left-color: #8b949e; background: transparent; }

    /* Progress bar */
    .progress-bar-outer {
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      background: linear(90deg, #f59e0b, #f97316);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* CodeMirror fixes */
    .CodeMirror {
      height: auto !important;
      min-height: 380px;
      font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
      font-size: 0.9rem;
    }
    .CodeMirror-scroll { overflow: visible; }

    @media (max-width: 768px) {
      .grid-cols-desktop { grid-template-columns: 1fr !important; }
      .col-span-full { grid-column: 1 / -1 !important; }
      #editor-container { min-height: 300px; }
    }
  </style>
</head>
<body class="dark bg-base-0 text-fg font-sans antialiased">
  <div id="app" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-base-1 border-b border-base p-4 flex items-center justify-between gap-4 flex-wrap">

        </div>
      </div>
    </header>

    <!-- Main grid -->
    <main class="flex-1 overflow-hidden grid grid-cols-desktop">

      <!-- LEFT: Modules + Theory + Task -->
      <aside id="left-panel" class="w-64 bg-base-1 border-r border-base overflow-y-auto p-4 flex flex-col gap-4">
        <!-- Modules navigation -->
        <section>
          <h2 class="text-xs uppercase tracking-wider text-fg-muted mb-2">Модули</h2>
          <nav id="modules-nav" class="flex flex-col gap-1"></nav>
        </section>

        <!-- Theory -->
        <section id="theory-section" class="flex-1">
          <h3 class="text-sm font-semibold text-fg mb-2">📖 Теория</h3>
          <div id="theory-content" class="text-sm text-fg-muted leading-relaxed prose prose-sm dark:prose-invert"></div>
        </section>

        <!-- Task -->
        <section id="task-section" class="border-t border-base pt-3">
          <h3 class="text-sm font-semibold text-fg mb-1">🎯 Задание</h3>
          <div id="task-content" class="text-sm text-fg-muted space-y-2"></div>
          <div id="task-goal" class="text-xs text-fg-muted mt-2 italic"></div>
        </section>
      </aside>

      <!-- CENTER: Editor + Controls -->
      <section class="flex flex-col p-4 gap-4 overflow-hidden">
        <!-- Editor container -->
        <div id="editor-container" class="flex-1 bg-base-2 rounded-lg border border-base overflow-hidden">
          <div id="editor"></div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2 flex-wrap">
          <button id="btn-run" class="btn-controls" aria-label="Запустить код">
            <i data-lucide="play" class="w-4 h-4"></i> ▶️ Запустить
          </button>
          <button id="btn-check" class="btn-controls" aria-label="Проверить решение">
            <i data-lucide="check" class="w-4 h-4"></i> ✅ Проверить
          </button>
          <button id="btn-reset" class="btn-controls btn-reset" aria-label="Сбросить код">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> 🔄 Сброс
          </button>
          <span id="run-status" class="text-xs text-fg-muted ml-2 hidden sm:inline"></span>
        </div>
      </section>

      <!-- RIGHT: Console + Test Checklist -->
      <aside class="w-80 bg-base-1 border-l border-base overflow-y-auto p-4 flex flex-col gap-4">
        <!-- Console -->
        <section>
          <h3 class="text-sm font-semibold text-fg mb-2">🖥️ Консоль</h3>
          <div id="console-box" role="log" aria-live="polite" aria-atomic="true"></div>
          <button id="btn-clear-console" class="mt-2 text-xs text-link hover:underline" aria-label="Очистить консоль">
            🧹 Очистить
          </button>
        </section>

        <!-- Test checklist -->
        <section id="tests-section" class="flex-1">
          <h3 class="text-sm font-semibold text-fg mb-2">🧪 Тесты</h3>
          <div id="tests-checklist" class="space-y-1"></div>
          <div id="tests-summary" class="text-xs text-fg-muted mt-2 hidden">
            <span id="tests-passed-count">0</span>/<span id="tests-total-count">0</span> пройдено
          </div>
        </section>
      </aside>
    </main>

    <!-- Mobile: Console at bottom -->

    </div>
  </div>

              id: 'l5-2',
              moduleId: 'm5',
              title: '2. Создание модуля (каркас)',
              theory: '## Создание модуля\n\nСохраните файл \`utils.py\` и импортируйте:\n\n\`\`\`python\n# utils.py\ndef hello():\n    return "Hi"\n\n# main.py\nfrom utils import hello\n\`\`\`\n\n🔧 _Каркас — замените на реальный проект._',
              initialCode: '# Каркас модуля\n# TODO: написать функции\npass',
              tests: [],
              hints: [],
              goal: 'Каркас — добавьте свои функции',
            },
          ],
        },
      ];

      // ═══════════════════════════════════════════════════════════
      // 2. STATE
      // ═══════════════════════════════════════════════════════════
      const state = {
        currentModuleId: 'm1',
        currentLessonId: 'l1-1',
        editorCode: '',
        progress: {},        // lessonId: { passed: bool, code: string }
        runHistory: [],
      };

      // ═══════════════════════════════════════════════════════════
      // 3. DOM REFERENCES
      // ═══════════════════════════════════════════════════════════
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => document.querySelectorAll(sel);

      const els = {
        editor: $('#editor'),
        modulesNav: $('#modules-nav'),
        theoryContent: $('#theory-content'),
        taskContent: $('#task-content'),
        taskGoal: $('#task-goal'),
        btnRun: $('#btn-run'),
        btnCheck: $('#btn-check'),
        btnReset: $('#btn-reset'),
        runStatus: $('#run-status'),
        consoleBox: $('#console-box'),
        consoleBoxMobile: $('#console-box-mobile'),
        btnClearConsole: $('#btn-clear-console'),
        testsChecklist: $('#tests-checklist'),
        testsSummary: $('#tests-summary'),
        testsPassedCount: $('#tests-passed-count'),
        testsTotalCount: $('#tests-total-count'),
        progressText: $('#progress-text'),
        progressBar: $('#progress-bar'),
      };

      // ═══════════════════════════════════════════════════════════
      // 4. PYODIDE MANAGER
      // ═══════════════════════════════════════════════════════════
      let pyodideReady = false;
      let pyodideInstance = null;
      let consoleBuffer = [];

      const PYODIDE_LOAD_TIMEOUT = 15000;
      let pyodideTimeout = null;

      function clearConsole() {
        consoleBuffer = [];
        els.consoleBox.innerHTML = '';
        els.consoleBoxMobile.innerHTML = '';
      }

      function appendConsole(text, isStderr = false) {
        const prefix = isStderr ? '⚠️ [stderr]' : '>>> ';
        const line = document.createElement('div');
        line.textContent = prefix + text;
        line.style.opacity = isStderr ? '0.8' : '1';
        els.consoleBox.appendChild(line);
        els.consoleBoxMobile.appendChild(line.cloneNode(true));
        els.consoleBox.scrollTop = els.consoleBox.scrollHeight;
        els.consoleBoxMobile.scrollTop = els.consoleBoxMobile.scrollHeight;
      }

      async function initPyodide() {
        try {
          els.consoleBox.innerHTML = '⏳ Загружаем Python (Pyodide)...';
          els.consoleBoxMobile.innerHTML = '⏳ Загружаем Python...';

          pyodideTimeout = setTimeout(() => {
            if (!pyodideReady) {
              showError('⏱️ Pyodide загружается дольше 15 сек. Проверьте сеть.');
              clearConsole();
              appendConsole('Попробуйте ещё раз.');
            }
          }, PYODIDE_LOAD_TIMEOUT);

          pyodideInstance = await loadPyodide({
            indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/',
          });

          // Пакеты для продвинутых уроков
          await pyodideInstance.loadPackage(['numpy', 'matplotlib']);

          // Перехват stdout/stderr
          pyodideInstance.setStdout((text) => appendConsole(text.trim()));
          pyodideInstance.setStderr((text) => appendConsole(text.trim(), true));

          pyodideReady = true;
          clearTimeout(pyodideTimeout);
          pyodideTimeout = null;
          appendConsole('✅ Python готов!');
          return pyodideInstance;
        } catch (err) {
          clearTimeout(pyodideTimeout);
          pyodideTimeout = null;
          pyodideReady = false;
          showError('❌ Не удалось загрузить Python. ' + (err.message || String(err)));
          console.error(err);
          return null;
        }
      }

      async function runPythonCode(code) {
        if (!pyodideReady) {
          showError('⏳ Python ещё не загружен. Подождите...');
          return { ok: false, error: 'Pyodide not ready' };
        }
        clearConsole();
        appendConsole('⏳ Выполняем...');
        try {
          // Возвращаем последнее выражение (если есть)
          const result = pyodideInstance.runPython(code);
          if (result !== undefined && result !== null) {
            appendConsole(String(result));
          }
          return { ok: true, value: result };
        } catch (err) {
          const msg = err.message || String(err);
          appendConsole('❌ ' + msg, true);
          return { ok: false, error: msg, pyError: err };
        }
      }

      // ═══════════════════════════════════════════════════════════
      // 5. CODEMIRROR MANAGER
      // ═══════════════════════════════════════════════════════════
      let editorInstance = null;

      function initEditor() {
        if (editorInstance) editorInstance.destroy();
        editorInstance = CodeMirror(els.editor, {
          mode: 'python',
          theme: 'material',
          lineNumbers: true,
          indentUnit: 4,
          tabSize: 4,
          lineWrapping: true,
          foldGutter: true,
          gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
          extraKeys: {
            'Ctrl-Enter': () => runCode(),
            'Shift-Enter': () => checkSolution(),
            'Ctrl-R': () => resetCode(),
          },
          autoCloseBrackets: true,
          matchBrackets: true,
        });

        // Обновляем состояние при изменении
        editorInstance.on('change', () => {
          state.editorCode = editorInstance.getValue();
          debounceSave();
        });
      }

      function setEditorCode(code) {
        if (editorInstance) {
          editorInstance.setValue(code || '');
        }
      }

      function getEditorCode() {
        return editorInstance ? editorInstance.getValue() : state.editorCode;
      }

      // ═══════════════════════════════════════════════════════════
      // 6. TEST RUNNER
      // ═══════════════════════════════════════════════════════════
      function buildTestFullCode(userCode, lessonTests) {
        // Объединяем код пользователя + тесты
        const testLines = lessonTests.map(t => t.test).join('\n');
        return userCode + '\n' + testLines;
      }

      function parseAssertionError(errorMsg) {
        if (!errorMsg) return 'Тест не пройден';
        const match = errorMsg.match(/AssertionError:\s*(.*)/);
        if (match) return match[1].trim();
        // Иногда Pyodide выдаёт: "AssertionError: ..."
        const match2 = errorMsg.match(/AssertionError\s*$(.*)$/);
        if (match2) return match2[1].trim();
        return errorMsg.replace(/^AssertionError:?\s*/, '').trim() || 'Тест не пройден';
      }

      async function runTests(lesson) {
        const userCode = getEditorCode();
        const fullCode = buildTestFullCode(userCode, lesson.tests);
        const result = await runPythonCode(fullCode);

        if (result.ok) {
          // Все тесты прошли
          markAllTestsPassed();
          return { passed: true, details: 'Все тесты пройдены ✅' };
        } else {
          // Ошибка — парсим, какой тест упал
          const errorMsg = result.error || '';
          const failedTestIndex = findFailedTestIndex(errorMsg, lesson.tests);
          markTests(failedTestIndex);
          return { passed: false, failedIndex: failedTestIndex, details: parseAssertionError(errorMsg) };
        }
      }

      function findFailedTestIndex(errorMsg, tests) {
        if (!errorMsg) return 0;
        // Ищем номер теста в сообщении (если есть)
        const match = errorMsg.match(/line\s+(\d+)/);
        if (match) {
          const line = parseInt(match[1], 10);
          for (let i = 0; i < tests.length; i++) {
            if (tests[i].test.includes('line')) return i;
          }
        }
        // По умолчанию — первый
        return 0;
      }

      function markAllTestsPassed() {
        const items = $$('#tests-checklist .test-item');
        items.forEach(item => {
          item.classList.add('passed');
          item.classList.remove('failed', 'pending');
          item.querySelector('.test-status')?.remove();
          const status = document.createElement('span');
          status.className = 'test-status text-success text-xs';
          status.textContent = ' ✅';
          item.appendChild(status);
        });
        updateTestSummary(true);
      }

      function markTests(failedIndex) {
        const items = $$('#tests-checklist .test-item');
        items.forEach((item, idx) => {
          item.classList.remove('passed', 'failed', 'pending');
          item.querySelector('.test-status')?.remove();
          if (idx <= failedIndex) {
            item.classList.add('failed');
            const status = document.createElement('span');
            status.className = 'test-status text-xs text-error';
            status.textContent = ' ❌';
            item.appendChild(status);
          } else {
            item.classList.add('pending');
            const status = document.createElement('span');
            status.className = 'test-status text-xs text-fg-muted';
            status.textContent = ' ⏳';
            item.appendChild(status);
          }
        });
        updateTestSummary(false);
      }

      function updateTestSummary(allPassed) {
        const total = els.testsTotalCount.textContent;
        const passed = allPassed ? total : Array.from($$('#tests-checklist .test-item.passed')).length;
        els.testsPassedCount.textContent = passed;
        els.testsTotalCount.textContent = total;
        if (allPassed) {
          els.testsSummary.classList.remove('hidden');
          els.testsSummary.style.color = '#10b981';
        } else if (passed > 0) {
          els.testsSummary.classList.remove('hidden');
          els.testsSummary.style.color = '#f59e0b';
        } else {
          els.testsSummary.classList.add('hidden');
        }
      }

      // ═══════════════════════════════════════════════════════════
      // 7. RENDERERS
      // ═══════════════════════════════════════════════════════════
      function renderModulesNav() {
        els.modulesNav.innerHTML = '';
        courseData.forEach(mod => {
          const isActive = mod.id === state.currentModuleId;
          const icon = lucide.icons[mod.icon] || lucide.icons.disc3;
          const moduleHTML = `
            <button class="module-btn w-full text-left px-3 py-2 rounded-md transition-all ${isActive ? 'bg-accent text-base-0' : 'text-fg-muted hover:bg-base-2'}"
                    data-module="${mod.id}" style="justify-content: flex-start;">
              <span class="inline-flex items-center gap-2">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  ${icon}
                </svg>
                <span class="font-medium">${mod.title}</span>
              </span>
              <span class="ml-auto text-xs ${isActive ? 'text-base-0' : 'text-fg-muted'}">${getModuleProgress(mod)}</span>
            </button>
          `;
          els.modulesNav.insertAdjacentHTML('beforeend', moduleHTML);
        });

        $$('.module-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const moduleId = btn.dataset.module;
            if (moduleId !== state.currentModuleId) {
              const mod = courseData.find(m => m.id === moduleId);
              if (mod && mod.lessons.length > 0) {
                state.currentModuleId = moduleId;
                state.currentLessonId = mod.lessons[0].id;
                loadLesson(state.currentLessonId);
                renderModulesNav();
              }
            }
          });
        });
      }

      function getModuleProgress(mod) {
        const lessons = mod.lessons;
        const passed = lessons.filter(l => state.progress[l.id]?.passed).length;
        return `${passed}/${lessons.length}`;
      }

      function renderTheoryAndTask(lesson) {
        // Theory (простая markdown-рендеринг)
        let theoryHtml = lesson.theory
          .replace(/### (.+)/g, '<strong class="text-fg text-lg">$1</strong>')
          .replace(/`\`\`python\n([\s\S]*?)\n\`\`\`/g, '<pre class="bg-base-2 p-2 rounded text-xs overflow-x-auto"><code class="text-fg">$1</code></pre>')
          .replace(/`([^`]+)`/g, '<code class="bg-base-2 px-1 rounded">$1</code>')
          .replace(/\n/g, '<br>');
        els.theoryContent.innerHTML = theoryHtml;

        // Task
        els.taskContent.innerHTML = lesson.theory.replace(/### (.+)/g, '').split('\n\n')[0] || lesson.title;
        els.taskGoal.textContent = lesson.goal || 'Выполните задание';

        // Tests checklist
        renderTestsChecklist(lesson);
      }

      function renderTestsChecklist(lesson) {
        els.testsChecklist.innerHTML = '';
        els.testsTotalCount.textContent = lesson.tests.length;
        if (lesson.tests.length === 0) {
          els.testsChecklist.innerHTML = '<p class="text-fg-muted text-sm">Нет тестов (каркасный урок).</p>';
          els.testsSummary.classList.add('hidden');
          return;
        }
        lesson.tests.forEach((test, idx) => {
          const passed = state.progress[lesson.id]?.passed === true;
          const statusClass = passed ? 'passed' : 'pending';
          const item = document.createElement('div');
          item.className = `test-item ${statusClass}`;
          item.innerHTML = `
            <span class="test-index text-xs text-fg-muted">${idx + 1}.</span>
            <span class="test-name text-sm">${test.name}</span>
          `;
          els.testsChecklist.appendChild(item);
        });
        updateTestSummary(false);
      }

      function updateProgressUI() {
        const lesson = getCurrentLesson();
        if (!lesson) return;
        const totalLessons = courseData.reduce((sum, m) => sum + m.lessons.length, 0);
        const passedLessons = Object.values(state.progress).filter(p => p?.passed).length;
        const pct = Math.round((passedLessons / totalLessons) * 100);
        els.progressText.textContent = `Урок ${passedLessons}/${totalLessons} — ${pct}%`;
        els.progressBar.style.width = pct + '%';
      }

      function getCurrentLesson() {
        const mod = courseData.find(m => m.id === state.currentModuleId);
        if (!mod) return null;
        return mod.lessons.find(l => l.id === state.currentLessonId) || mod.lessons[0];
      }

      // ═══════════════════════════════════════════════════════════
      // 8. LOCALSTORAGE
      // ═══════════════════════════════════════════════════════════
      const STORAGE_KEY = 'pypcamp-progress-v1';
      const SAVE_DEBOUNCE = 500;
      let saveTimeout = null;

      function debounceSave() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveProgress, SAVE_DEBOUNCE);
      }

      function saveProgress() {
        try {
          const data = {
            currentModuleId: state.currentModuleId,
            currentLessonId: state.currentLessonId,
            editorCode: getEditorCode(),
            progress: state.progress,
            runHistory: state.runHistory.slice(0, 50),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          // localStorage full — игнорируем
        }
      }

      function loadProgress() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const data = JSON.parse(raw);
          // Миграция / валидация
          if (typeof data.currentModuleId !== 'string') return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      function applyLoadedProgress(data) {
        state.currentModuleId = data.currentModuleId;
        state.currentLesson
