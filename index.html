<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация по проектам</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background-color: #1e293b;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: #334155;
            color: #e2e8f0;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease-in-out;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background-color: #3b82f6;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            border-color: #60a5fa;
        }

        .nav-link span.file {
            font-size: 12px;
            color: #94a3b8;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
            transition: color 0.2s ease;
        }

        .nav-link:hover span.file {
            color: #dbeafe;
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Навигация</h1>
        <p class="subtitle">Выберите нужный сервис или модель</p>

        <nav class="nav-list">
            <a href="cursor.html" class="nav-link">
                <span>Cursor</span>
                <span class="file">cursor.html</span>
            </a>
            <a href="deepseek.html" class="nav-link">
                <span>DeepSeek</span>
                <span class="file">deepseek.html</span>
            </a>
            <a href="gigachat.html" class="nav-link">
                <span>GigaChat</span>
                <span class="file">gigachat.html</span>
            </a>
            <a href="openclaw.html" class="nav-link">
                <span>OpenClaw</span>
                <span class="file">openclaw.html</span>
            </a>
            <a href="qwen_web.html" class="nav-link">
                <span>Qwen Web</span>
                <span class="file">qwen_web.html</span>
            </a>
            <a href="yandexgpt.html" class="nav-link">
                <span>YandexGPT</span>
                <span class="file">yandexgpt.html</span>
            </a>
            <a href="zai.html" class="nav-link">
                <span>ZAI</span>
                <span class="file">zai.html</span>
            </a>
        </nav>
    </div>

</body>
</html>
