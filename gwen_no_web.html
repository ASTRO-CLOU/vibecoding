<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCamp — Интерактивный курс Python</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0a0a23',
                        secondary: '#1b1b32',
                        accent: '#f1be32',
                        success: '#198754',
                        danger: '#dc3545',
                        editorBg: '#2a2a40'
                    }
                }
            }
        }
    </script>

    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1b1b32; }
        ::-webkit-scrollbar-thumb { background: #3b3b4f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f4f6b; }

        /* CodeMirror adjustments */
        .CodeMirror {
            height: 100% !important;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
        }

        /* Loading Overlay */
        #loading-overlay {
            transition: opacity 0.5s ease;
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Mobile Tabs */
        .tab-active {
            border-bottom: 2px solid #f1be32;
            color: #f1be32;
        }
    </style>
</head>
<body class="bg-primary text-gray-200 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Loading Overlay (Pyodide Initialization) -->
    <div id="loading-overlay" class="fixed inset-0 bg-primary z-50 flex flex-col items-center justify-center">
        <i data-lucide="loader-2" class="w-12 h-12 text-accent animate-spin mb-4"></i>
        <h2 class="text-xl font-bold text-white mb-2">Загрузка Python-движка...</h2>
        <p id="loading-status" class="text-gray-400 text-sm">Инициализация WebAssembly</p>
    </div>

    <!-- Header -->
    <header class="bg-secondary border-b border-gray-700 px-4 py-3 flex items-center justify-between shrink-0 z-40">
        <div class="flex items-center gap-2">
            <i data-lucide="terminal" class="text-accent w-6 h-6"></i>
            <h1 class="text-xl font-bold text-white tracking-tight">Py<span class="text-accent">Camp</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-2 text-sm text-gray-400">
                <span>Прогресс:</span>
                <div class="w-32 h-2 bg-gray-700 rounded-full overflow-hidden">
                    <div id="global-progress-bar" class="h-full bg-accent transition-all duration-500" style="width: 0%"></div>
                </div>
                <span id="global-progress-text">0%</span>
            </div>
            <button id="btn-reset-progress" class="text-gray-400 hover:text-danger transition-colors" title="Сбросить прогресс">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Tabs -->
    <div class="md:hidden flex bg-secondary border-b border-gray-700 shrink-0">
        <button class="mobile-tab tab-active flex-1 py-2 text-center text-sm font-medium" data-target="instructions">Теория</button>
        <button class="mobile-tab flex-1 py-2 text-center text-sm font-medium text-gray-400" data-target="editor">Редактор</button>
        <button class="mobile-tab flex-1 py-2 text-center text-sm font-medium text-gray-400" data-target="console">Консоль</button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Left Column: Instructions -->
        <aside id="panel-instructions" class="mobile-panel w-full md:w-1/4 lg:w-1/5 bg-secondary border-r border-gray-700 flex flex-col overflow-hidden">
            <!-- Course Navigation -->
            <div class="p-4 border-b border-gray-700">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Модули</h2>
                <div id="course-nav" class="space-y-1 max-h-40 overflow-y-auto pr-2">
                    <!-- Generated by JS -->
                </div>
            </div>
            
            <!-- Lesson Content -->
            <div class="flex-1 overflow-y-auto p-4">
                <h2 id="lesson-title" class="text-xl font-bold text-white mb-4"></h2>
                <div id="lesson-theory" class="prose prose-invert prose-sm max-w-none mb-6 text-gray-300 leading-relaxed">
                    <!-- Generated by JS -->
                </div>
                
                <div class="bg-primary/50 rounded-lg p-4 border border-gray-700">
                    <h3 class="text-accent font-bold mb-2 flex items-center gap-2">
                        <i data-lucide="target" class="w-4 h-4"></i> Задание
                    </h3>
                    <p id="lesson-task" class="text-sm text-gray-300 mb-4"></p>
                    
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Условия прохождения:</h4>
                    <ul id="lesson-conditions" class="space-y-2 text-sm">
                        <!-- Generated by JS -->
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Center Column: Editor -->
        <section id="panel-editor" class="mobile-panel hidden md:flex flex-col w-full md:w-2/4 lg:w-3/5 bg-primary border-r border-gray-700">
            <!-- Editor Toolbar -->
            <div class="bg-secondary px-4 py-2 flex items-center justify-between border-b border-gray-700 shrink-0">
                <span class="text-xs text-gray-400 font-mono">main.py</span>
                <div class="flex gap-2">
                    <button id="btn-reset" class="px-3 py-1 text-xs bg-gray-700 hover:bg-gray-600 rounded transition-colors flex items-center gap-1">
                        <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Сброс
                    </button>
                    <button id="btn-run" class="px-3 py-1 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded transition-colors flex items-center gap-1">
                        <i data-lucide="play" class="w-3 h-3"></i> Запуск
                    </button>
                    <button id="btn-check" class="px-3 py-1 text-xs bg-success hover:bg-green-600 text-white rounded transition-colors flex items-center gap-1">
                        <i data-lucide="check-circle" class="w-3 h-3"></i> Проверить
                    </button>
                </div>
            </div>
            <!-- CodeMirror Container -->
            <div class="flex-1 relative overflow-hidden">
                <textarea id="code-editor"></textarea>
            </div>
        </section>

        <!-- Right Column: Console & Tests -->
        <aside id="panel-console" class="mobile-panel hidden md:flex flex-col w-full md:w-1/4 lg:w-1/5 bg-primary">
            <!-- Console Header -->
            <div class="bg-secondary px-4 py-2 border-b border-gray-700 shrink-0">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="terminal" class="w-3 h-3"></i> Консоль
                </h3>
            </div>
            <!-- Console Output -->
            <div id="console-output" class="flex-1 bg-black p-3 font-mono text-xs overflow-y-auto text-gray-300 whitespace-pre-wrap break-words">
                <span class="text-gray-500">// Здесь появится вывод вашей программы...</span>
            </div>
            
            <!-- Tests Panel -->
            <div class="h-1/3 bg-secondary border-t border-gray-700 flex flex-col shrink-0">
                <div class="px-4 py-2 border-b border-gray-700">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="list-checks" class="w-3 h-3"></i> Тесты
                    </h3>
                </div>
                <div id="tests-output" class="flex-1 overflow-y-auto p-3 space-y-2">
                    <span class="text-gray-500 text-xs">Нажмите "Проверить", чтобы запустить тесты.</span>
                </div>
            </div>
        </aside>

    </main>

    <script>
        // =========================================================================
        // 1. COURSE DATA (JSON Structure)
        // =========================================================================
        const COURSE_DATA = [
            {
                module: "Основы Python",
                lessons: [
                    {
                        id: "variables",
                        title: "Переменные и вывод",
                        theory: `<p>В Python переменные создаются в момент присваивания значения. Указывать тип данных не нужно.</p>
                                 <pre class="bg-black p-2 rounded my-2 text-accent">message = "Привет, мир!"\nprint(message)</pre>
                                 <p>Функция <code>print()</code> выводит данные в консоль.</p>`,
                        task: "Создайте переменную <code>name</code> со значением <code>'Alice'</code> и переменную <code>age</code> со значением <code>25</code>. Выведите их на экран в формате: <code>Name: Alice, Age: 25</code>.",
                        conditions: [
                            "Переменная `name` должна быть равна 'Alice'",
                            "Переменная `age` должна быть равна 25",
                            "Вывод должен содержать точную строку 'Name: Alice, Age: 25'"
                        ],
                        starterCode: `# Создайте переменные ниже\n\n\n# Выведите результат\n`,
                        tests: [
                            { name: "Переменная name равна 'Alice'", code: "assert name == 'Alice', f'Ожидалось Alice, получено {name}'" },
                            { name: "Переменная age равна 25", code: "assert age == 25, f'Ожидалось 25, получено {age}'" },
                            { name: "Правильный вывод в консоль", code: "assert 'Name: Alice, Age: 25' in user_output, 'Строка вывода не совпадает с заданием'" }
                        ]
                    },
                    {
                        id: "data_types",
                        title: "Типы данных и преобразование",
                        theory: `<p>Основные типы данных: <code>int</code> (целые), <code>float</code> (дробные), <code>str</code> (строки), <code>bool</code> (логические).</p>
                                 <p>Для преобразования используются функции <code>int()</code>, <code>str()</code>, <code>float()</code>.</p>`,
                        task: "Дана строка <code>score_str = '100'</code>. Преобразуйте её в целое число и сохраните в переменную <code>score</code>. Затем создайте переменную <code>is_winner</code> типа bool, которая равна True, если score больше 50.",
                        conditions: [
                            "Переменная `score` должна быть целым числом (int)",
                            "Значение `score` должно быть 100",
                            "Переменная `is_winner` должна быть True"
                        ],
                        starterCode: `score_str = '100'\n\n# Преобразуйте строку в число\n\n\n# Определите, является ли игрок победителем\n`,
                        tests: [
                            { name: "Переменная score существует", code: "assert 'score' in locals(), 'Переменная score не найдена'" },
                            { name: "score имеет тип int", code: "assert isinstance(score, int), f'Ожидался тип int, получен {type(score).__name__}'" },
                            { name: "Значение score равно 100", code: "assert score == 100" },
                            { name: "is_winner равен True", code: "assert is_winner is True, f'Ожидалось True, получено {is_winner}'" }
                        ]
                    }
                ]
            },
            {
                module: "Управление потоком",
                lessons: [
                    {
                        id: "conditionals",
                        title: "Условные операторы (if/else)",
                        theory: `<p>Конструкция <code>if</code> позволяет выполнять код только при соблюдении условия.</p>
                                 <pre class="bg-black p-2 rounded my-2 text-accent">if x > 0:\n    print("Положительное")\nelse:\n    print("Неположительное")</pre>`,
                        task: "Напишите функцию <code>check_speed(speed)</code>, которая возвращает строку <code>'Fast'</code>, если скорость больше 100, и <code>'Normal'</code> в противном случае.",
                        conditions: [
                            "Функция `check_speed` должна быть определена",
                            "`check_speed(120)` должна вернуть 'Fast'",
                            "`check_speed(80)` должна вернуть 'Normal'"
                        ],
                        starterCode: `def check_speed(speed):\n    # Напишите ваш код здесь\n    pass\n`,
                        tests: [
                            { name: "Функция check_speed определена", code: "assert callable(check_speed), 'check_speed не является функцией'" },
                            { name: "check_speed(120) == 'Fast'", code: "assert check_speed(120) == 'Fast', f'Ожидалось Fast, получено {check_speed(120)}'" },
                            { name: "check_speed(80) == 'Normal'", code: "assert check_speed(80) == 'Normal', f'Ожидалось Normal, получено {check_speed(80)}'" },
                            { name: "check_speed(100) == 'Normal'", code: "assert check_speed(100) == 'Normal', 'Граничное условие (100) не прошло'" }
                        ]
                    }
                ]
            },
            {
                module: "Циклы и структуры",
                lessons: [
                    {
                        id: "loops",
                        title: "Цикл for и списки",
                        theory: `<p>Цикл <code>for</code> используется для перебора элементов последовательности.</p>
                                 <pre class="bg-black p-2 rounded my-2 text-accent">squares = []\nfor i in range(5):\n    squares.append(i**2)</pre>`,
                        task: "Создайте список <code>squares</code>, содержащий квадраты чисел от 1 до 5 включительно (т.е. [1, 4, 9, 16, 25]). Используйте цикл <code>for</code>.",
                        conditions: [
                            "Переменная `squares` должна быть списком",
                            "Список должен содержать ровно 5 элементов",
                            "Список должен быть равен [1, 4, 9, 16, 25]"
                        ],
                        starterCode: `squares = []\n\n# Напишите цикл для заполнения списка\n`,
                        tests: [
                            { name: "squares является списком", code: "assert isinstance(squares, list)" },
                            { name: "Длина списка равна 5", code: "assert len(squares) == 5, f'Ожидалось 5 элементов, получено {len(squares)}'" },
                            { name: "Значения списка верны", code: "assert squares == [1, 4, 9, 16, 25], f'Список не совпадает: {squares}'" }
                        ]
                    },
                    // Каркасы для масштабирования
                    { id: "while_loops", title: "Цикл while", theory: "...", task: "...", conditions: [], starterCode: "# while loop", tests: [] },
                    { id: "dictionaries", title: "Словари", theory: "...", task: "...", conditions: [], starterCode: "# dicts", tests: [] }
                ]
            },
            {
                module: "Функции",
                lessons: [
                    { id: "functions_args", title: "Аргументы функций", theory: "...", task: "...", conditions: [], starterCode: "# args", tests: [] },
                    { id: "lambda", title: "Lambda-функции", theory: "...", task: "...", conditions: [], starterCode: "# lambda", tests: [] }
                ]
            }
        ];

        // Flatten course data for easier indexing
        const ALL_LESSONS = COURSE_DATA.flatMap(mod => mod.lessons);

        // =========================================================================
        // 2. STATE MANAGEMENT & LOCAL STORAGE
        // =========================================================================
        const STORAGE_KEY = 'pycamp_progress_v1';
        
        let state = {
            currentLessonIndex: 0,
            completedLessons: [],
            savedCode: {}
        };

        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) {
                console.error("Failed to load progress", e);
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Failed to save progress", e);
            }
        }

        // =========================================================================
        // 3. UI MANAGER
        // =========================================================================
        const ui = {
            init() {
                lucide.createIcons();
                this.renderNav();
                this.loadLesson(state.currentLessonIndex);
                this.updateGlobalProgress();
                
                // Mobile Tabs
                document.querySelectorAll('.mobile-tab').forEach(tab => {
                    tab.addEventListener('click', () => this.switchMobileTab(tab.dataset.target));
                });

                // Reset Progress
                document.getElementById('btn-reset-progress').addEventListener('click', () => {
                    if(confirm('Вы уверены, что хотите сбросить весь прогресс?')) {
                        localStorage.removeItem(STORAGE_KEY);
                        location.reload();
                    }
                });
            },

            renderNav() {
                const nav = document.getElementById('course-nav');
                nav.innerHTML = '';
                
                let globalIndex = 0;
                COURSE_DATA.forEach(mod => {
                    const modEl = document.createElement('div');
                    modEl.className = 'mb-3';
                    modEl.innerHTML = `<h3 class="text-xs font-bold text-accent uppercase mb-1">${mod.module}</h3>`;
                    
                    mod.lessons.forEach(lesson => {
                        const btn = document.createElement('button');
                        const isCompleted = state.completedLessons.includes(lesson.id);
                        const isCurrent = globalIndex === state.currentLessonIndex;
                        
                        btn.className = `w-full text-left px-2 py-1.5 text-sm rounded flex items-center gap-2 transition-colors mb-0.5
                            ${isCurrent ? 'bg-gray-700 text-white font-bold' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`;
                        
                        btn.innerHTML = `
                            <i data-lucide="${isCompleted ? 'check-circle-2' : 'circle'}" class="w-3 h-3 ${isCompleted ? 'text-success' : ''}"></i>
                            <span class="truncate">${lesson.title}</span>
                        `;
                        
                        const currentIndex = globalIndex;
                        btn.addEventListener('click', () => this.loadLesson(currentIndex));
                        modEl.appendChild(btn);
                        globalIndex++;
                    });
                    nav.appendChild(modEl);
                });
                lucide.createIcons();
            },

            loadLesson(index) {
                state.currentLessonIndex = index;
                const lesson = ALL_LESSONS[index];
                
                document.getElementById('lesson-title').textContent = lesson.title;
                document.getElementById('lesson-theory').innerHTML = lesson.theory;
                document.getElementById('lesson-task').innerHTML = lesson.task;
                
                const conditionsList = document.getElementById('lesson-conditions');
                conditionsList.innerHTML = lesson.conditions.map(c => 
                    `<li class="flex items-start gap-2 text-gray-400"><i data-lucide="chevron-right" class="w-3 h-3 mt-1 text-accent shrink-0"></i><span>${c}</span></li>`
                ).join('');
                
                // Load code
                const savedCode = state.savedCode[lesson.id];
                const codeToLoad = savedCode !== undefined ? savedCode : lesson.starterCode;
                editorManager.setCode(codeToLoad);
                
                // Clear console and tests
                document.getElementById('console-output').innerHTML = '<span class="text-gray-500">// Ожидание выполнения...</span>';
                document.getElementById('tests-output').innerHTML = '<span class="text-gray-500 text-xs">Нажмите "Проверить", чтобы запустить тесты.</span>';
                
                this.renderNav();
                saveProgress();
                
                // Switch to editor on mobile
                if (window.innerWidth < 768) {
                    this.switchMobileTab('editor');
                }
                
                lucide.createIcons();
            },

            switchMobileTab(target) {
                document.querySelectorAll('.mobile-tab').forEach(t => {
                    t.classList.remove('tab-active');
                    t.classList.add('text-gray-400');
                });
                document.querySelector(`.mobile-tab[data-target="${target}"]`).classList.add('tab-active');
                document.querySelector(`.mobile-tab[data-target="${target}"]`).classList.remove('text-gray-400');

                document.querySelectorAll('.mobile-panel').forEach(p => p.classList.add('hidden'));
                document.getElementById(`panel-${target}`).classList.remove('hidden');
            },

            updateGlobalProgress() {
                const total = ALL_LESSONS.filter(l => l.tests.length > 0).length;
                const completed = state.completedLessons.length;
                const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
                
                document.getElementById('global-progress-bar').style.width = `${pct}%`;
                document.getElementById('global-progress-text').textContent = `${pct}%`;
            },

            markCompleted(lessonId) {
                if (!state.completedLessons.includes(lessonId)) {
                    state.completedLessons.push(lessonId);
                    saveProgress();
                    this.updateGlobalProgress();
                    this.renderNav();
                }
            }
        };

        // =========================================================================
        // 4. EDITOR MANAGER (CodeMirror)
        // =========================================================================
        const editorManager = {
            editor: null,
            init() {
                this.editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                    mode: 'python',
                    theme: 'dracula',
                    lineNumbers: true,
                    indentUnit: 4,
                    tabSize: 4,
                    indentWithTabs: false,
                    lineWrapping: true,
                    autofocus: true
                });

                this.editor.on('change', () => {
                    const lesson = ALL_LESSONS[state.currentLessonIndex];
                    state.savedCode[lesson.id] = this.editor.getValue();
                    saveProgress();
                });

                document.getElementById('btn-reset').addEventListener('click', () => this.resetCode());
            },
            setCode(code) {
                this.editor.setValue(code);
                this.editor.clearHistory();
            },
            getCode() {
                return this.editor.getValue();
            },
            resetCode() {
                const lesson = ALL_LESSONS[state.currentLessonIndex];
                if(confirm('Сбросить код к начальному состоянию?')) {
                    this.setCode(lesson.starterCode);
                    delete state.savedCode[lesson.id];
                    saveProgress();
                }
            }
        };

        // =========================================================================
        // 5. PYODIDE RUNNER (Execution & Testing Engine)
        // =========================================================================
        const pyRunner = {
            pyodide: null,
            isReady: false,

            async init() {
                const statusEl = document.getElementById('loading-status');
                try {
                    statusEl.textContent = 'Загрузка ядра Python (это может занять несколько секунд)...';
                    this.pyodide = await loadPyodide();
                    
                    statusEl.textContent = 'Настройка окружения...';
                    // Pre-load standard libraries if needed
                    await this.pyodide.loadPackage(['micropip']);
                    
                    this.isReady = true;
                    statusEl.textContent = 'Готово!';
                    
                    setTimeout(() => {
                        document.getElementById('loading-overlay').classList.add('fade-out');
                    }, 500);
                    
                } catch (err) {
                    statusEl.textContent = `Ошибка загрузки: ${err.message}`;
                    statusEl.classList.add('text-danger');
                    console.error(err);
                }
            },

            async execute(userCode, runTests = false) {
                if (!this.isReady) return;

                const lesson = ALL_LESSONS[state.currentLessonIndex];
                const consoleEl = document.getElementById('console-output');
                const testsEl = document.getElementById('tests-output');
                
                // UI: Loading state
                consoleEl.innerHTML = '<span class="text-accent animate-pulse">Выполнение...</span>';
                if (runTests) testsEl.innerHTML = '<span class="text-accent animate-pulse">Запуск тестов...</span>';
                
                this.setButtonsDisabled(true);

                // Build Python Execution Payload
                const testCodeStr = runTests ? lesson.tests.map(t => `test("${t.name}", lambda: ${t.code})`).join('\n') : '';
                
                const payload = `
import sys
import json
import io

out = io.StringIO()
sys.stdout = out
sys.stderr = out

results = []
user_output = ""

try:
    # --- USER CODE ---
${userCode.split('\n').map(line => '    ' + line).join('\n')}
    # -----------------
    user_output = out.getvalue()
except Exception as e:
    sys.stdout = sys.__stdout__
    sys.stderr = sys.__stderr__
    print(json.dumps({"status": "error", "output": out.getvalue(), "error": str(e)}))
    sys.exit(0)

if ${runTests ? 'True' : 'False'}:
    def test(name, fn):
        try:
            fn()
            results.append({"name": name, "pass": True, "msg": ""})
        except Exception as e:
            results.append({"name": name, "pass": False, "msg": str(e)})
            
${testCodeStr.split('\n').map(line => '    ' + line).join('\n')}

sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
print(json.dumps({"status": "success", "output": user_output, "tests": results}))
`;

                try {
                    // Execute in Pyodide
                    await this.pyodide.runPythonAsync(payload);
                    // Pyodide prints the JSON to stdout, which we need to capture.
                    // Wait, runPythonAsync doesn't automatically capture print to JS unless we override.
                    // Let's use a custom stdout handler for Pyodide.
                } catch (err) {
                    // Handled inside python script mostly, but syntax errors might throw here
                    this.renderConsole(err.message, true);
                }

                this.setButtonsDisabled(false);
            },

            // Better approach: Override Pyodide stdout
            async run(userCode, runTests) {
                if (!this.isReady) return;

                const lesson = ALL_LESSONS[state.currentLessonIndex];
                const consoleEl = document.getElementById('console-output');
                const testsEl = document.getElementById('tests-output');
                
                consoleEl.innerHTML = '<span class="text-accent animate-pulse">Выполнение...</span>';
                if (runTests) testsEl.innerHTML = '<span class="text-accent animate-pulse">Запуск тестов...</span>';
                
                this.setButtonsDisabled(true);

                let outputBuffer = "";
                this.pyodide.setStdout({
                    batched: (str) => { outputBuffer += str + "\n"; }
                });
                this.pyodide.setStderr({
                    batched: (str) => { outputBuffer += str + "\n"; }
                });

                const testCodeStr = runTests ? lesson.tests.map(t => `test("${t.name}", lambda: ${t.code})`).join('\n') : '';
                
                const payload = `
import sys
import json
import io

results = []
user_output = ""

try:
    # Capture user prints specifically
    capture = io.StringIO()
    sys.stdout = capture
    sys.stderr = capture
    
    # --- USER CODE ---
${userCode.split('\n').map(line => '    ' + line).join('\n')}
    # -----------------
    user_output = capture.getvalue()
    
except Exception as e:
    sys.stdout = sys.__stdout__
    sys.stderr = sys.__stderr__
    print(json.dumps({"status": "error", "output": capture.getvalue(), "error": str(e)}))
    sys.exit(0)

if ${runTests ? 'True' : 'False'}:
    def test(name, fn):
        try:
            fn()
            results.append({"name": name, "pass": True, "msg": ""})
        except Exception as e:
            results.append({"name": name, "pass": False, "msg": str(e)})
            
${testCodeStr.split('\n').map(line => '    ' + line).join('\n')}

sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
# Print final JSON payload to the real stdout (which goes to outputBuffer)
print(json.dumps({"status": "success", "output": user_output, "tests": results}))
`;

                try {
                    await this.pyodide.runPythonAsync(payload);
                    
                    // Parse the last line of outputBuffer which should be our JSON
                    const lines = outputBuffer.trim().split('\n');
                    const jsonStr = lines[lines.length - 1];
                    let result;
                    
                    try {
                        result = JSON.parse(jsonStr);
                    } catch(e) {
                        // Fallback if JSON parsing fails (e.g., user printed invalid JSON)
                        result = { status: "success", output: outputBuffer, tests: [] };
                    }

                    this.renderConsole(result.output, result.status === 'error');
                    if (runTests) this.renderTests(result.tests);

                    // Check if all tests passed
                    if (runTests && result.status === 'success' && result.tests.length > 0) {
                        const allPassed = result.tests.every(t => t.pass);
                        if (allPassed) {
                            ui.markCompleted(lesson.id);
                        }
                    }

                } catch (err) {
                    this.renderConsole(err.message, true);
                }

                this.setButtonsDisabled(false);
            },

            renderConsole(text, isError) {
                const el = document.getElementById('console-output');
                if (!text.trim()) {
                    el.innerHTML = '<span class="text-gray-500">// Программа выполнена без вывода</span>';
                } else {
                    el.textContent = text;
                    el.className = `flex-1 bg-black p-3 font-mono text-xs overflow-y-auto whitespace-pre-wrap break-words ${isError ? 'text-danger' : 'text-gray-300'}`;
                }
            },

            renderTests(tests) {
                const el = document.getElementById('tests-output');
                if (!tests || tests.length === 0) {
                    el.innerHTML = '<span class="text-gray-500 text-xs">Нет тестов для этого урока.</span>';
                    return;
                }

                el.innerHTML = tests.map(t => `
                    <div class="flex items-start gap-2 text-xs p-2 rounded ${t.pass ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'}">
                        <i data-lucide="${t.pass ? 'check-circle-2' : 'x-circle'}" class="w-4 h-4 shrink-0 mt-0.5"></i>
                        <div>
                            <div class="font-bold">${t.name}</div>
                            ${!t.pass ? `<div class="text-[10px] opacity-80 mt-1 font-mono">${t.msg}</div>` : ''}
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            },

            setButtonsDisabled(disabled) {
                document.getElementById('btn-run').disabled = disabled;
                document.getElementById('btn-check').disabled = disabled;
                document.getElementById('btn-reset').disabled = disabled;
                
                const runBtn = document.getElementById('btn-run');
                const checkBtn = document.getElementById('btn-check');
                
                if (disabled) {
                    runBtn.innerHTML = '<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Запуск...';
                    checkBtn.innerHTML = '<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Проверка...';
                } else {
                    runBtn.innerHTML = '<i data-lucide="play" class="w-3 h-3"></i> Запуск';
                    checkBtn.innerHTML = '<i data-lucide="check-circle" class="w-3 h-3"></i> Проверить';
                }
                lucide.createIcons();
            }
        };

        // =========================================================================
        // 6. INITIALIZATION
        // =========================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            loadProgress();
            ui.init();
            editorManager.init();
            
            // Event Listeners for Execution
            document.getElementById('btn-run').addEventListener('click', () => {
                pyRunner.run(editorManager.getCode(), false);
            });
            
            document.getElementById('btn-check').addEventListener('click', () => {
                pyRunner.run(editorManager.getCode(), true);
            });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (e.shiftKey) {
                        pyRunner.run(editorManager.getCode(), true); // Ctrl+Shift+Enter to check
                    } else {
                        pyRunner.run(editorManager.getCode(), false); // Ctrl+Enter to run
                    }
                }
            });

            // Start Pyodide Loading
            await pyRunner.init();
        });
    </script>
</body>
</html>
